worker_processes auto;
events { worker_connections 1024; }
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  limit_req_zone $binary_remote_addr zone=requests:10m rate=5r/s;
  # Avoid logging query strings or keys. Services emit correlated request IDs.
  log_format safe '$remote_addr $request_method $uri $status $request_time';
  access_log /var/log/nginx/access.log safe;
  server {
    listen 8080;
    client_max_body_size 40m;
    client_body_timeout 30s;
    limit_req zone=requests burst=20 nodelay;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 610s;
    proxy_send_timeout 610s;
    proxy_buffering off;
    proxy_set_header Connection '';
    location = /healthz { return 200 'edge alive\n'; }
    location = /readyz { set $up http://rag:8000; proxy_pass $up$request_uri; }
    location = /v1/embeddings { set $up http://embeddings:8000; proxy_pass $up$request_uri; }
    location = /v1/rerank { set $up http://reranking:8000; proxy_pass $up$request_uri; }
    location = /v1/chat/completions { set $up http://generation:8000; proxy_pass $up$request_uri; }
    location = /v1/search { set $up http://retrieval:8000; proxy_pass $up$request_uri; }
    location /v1/indexes { set $up http://retrieval:8000; proxy_pass $up$request_uri; }
    location = /v1/rag { set $up http://rag:8000; proxy_pass $up$request_uri; }
    location /v1/jobs { set $up http://jobs:8000; proxy_pass $up$request_uri; }
    location = /v1/events { set $up http://jobs:8000; proxy_pass $up$request_uri; }
    # Explicit role discovery: /services/embeddings/openapi.json, /services/rag/docs, etc.
    location ~ ^/services/(?<svc>embeddings|reranking|generation|retrieval|rag|jobs)/(?<tail>.*)$ {
      set $up http://$svc:8000/$tail;
      proxy_pass $up$is_args$args;
    }
    location / { return 404; }
  }
}
